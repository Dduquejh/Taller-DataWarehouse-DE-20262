name: ecommerce_dw
version: '1.0.0'
config-version: 2
profile: ecommerce_dw

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]
# dbt_runner apunta los paquetes a una carpeta escribible del contenedor.
packages-install-path: "{{ env_var('DBT_PACKAGES_DIR', 'dbt_packages') }}"

models:
  ecommerce_dw:
    intermediate:
      +schema: intermediate
      +materialized: view
      # Vistas de enlace tardío: reconstruir una vista no borra en cascada a
      # las que dependen de ella.
      +bind: false
    quarantine:
      +schema: quarantine
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

snapshots:
  ecommerce_dw:
    +schema: snapshots

vars:
  valid_sales_channels: ['web', 'móvil', 'tienda']
  valid_event_types: ['vista_producto', 'busqueda', 'agregar_carrito']
  business_timezone: 'America/Bogota'
  date_dimension_start: '2025-01-01'
  date_dimension_end: '2028-01-01'  # fin exclusivo, compatible con dbt_utils.date_spine
  incremental_lookback_days: 7  # días recientes que se reprocesan para absorber datos tardíos

seeds:
  ecommerce_dw:
    colombia_holidays:
      +column_types:
        date: date
