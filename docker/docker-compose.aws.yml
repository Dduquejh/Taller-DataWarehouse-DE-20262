# Airflow y dbt en EC2. A diferencia de docker-compose.yml (local), aquí no
# hay MySQL ni MongoDB: las fuentes son RDS y DocumentDB, y el warehouse es
# Redshift Serverless. Las rutas son relativas a la raíz del repo:
#
#   docker compose --project-directory . -f docker/docker-compose.aws.yml up -d --build
#
# (En la instancia, el atajo "dwc" hace lo mismo.)
#
# .env lo genera dw-render-env desde el parámetro de SSM. No contiene
# contraseñas de las bases: el código las lee de Secrets Manager con el rol
# de la instancia, que llega a los contenedores por IMDSv2.
name: de-dw-aws

x-airflow-common: &airflow-common
  image: local/ecommerce-airflow:2.11.2
  build:
    context: ./docker
  env_file: .env
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Falta AIRFLOW_FERNET_KEY en .env}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Falta AIRFLOW_SECRET_KEY en .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/src
    DEPLOYMENT_TARGET: aws
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./src/airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./certs:/opt/airflow/certs:ro
  restart: unless-stopped

services:
  # Metadatos de Airflow (no datos del negocio).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Falta AIRFLOW_ADMIN_PASSWORD en .env}
    command: version
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
